version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: nodejs-service-mielomanka
    image: mielomanka/nodejs2025q4-service-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}"
    depends_on:
      - postgres
    ports:
      - "${PORT}:${PORT}"
    networks:
      - home-lib-network

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: home-lib-db-mielomanka
    image: mielomanka/nodejs2025q4-service-postgres:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pglogs:/var/log/postgresql 
    networks:
      - home-lib-network

volumes:
  pgdata:
  pglogs:

networks:
  home-lib-network:
    driver: bridge
